<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AI Image Generator</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <!-- Header -->
      <header class="header">
        <div class="logo-wrapper">
          <div class="logo">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
          </div>

          <h1>AI Image Generator</h1>
        </div>

        <button class="theme-toggle" type="button">
          <i class="fa-solid fa-moon"></i>
        </button>
      </header>

      <!-- Main Content -->
      <div class="main-content">
        <form action="#" class="prompt-form">
          <!-- Prompt Container -->
          <div class="prompt-container">
            <textarea
              class="prompt-input"
              placeholder="Describe your imagination in detail..."
              autofocus
              required
            ></textarea>

            <button
              type="button"
              class="prompt-btn"
              title="Generate random prompt"
            >
              <i class="fa-solid fa-dice"></i>
            </button>
          </div>

          <!-- Prompt Actions -->
          <div class="prompt-actions">
            <!-- Model -->
            <div class="select-wrapper">
              <select class="custom-select" id="model-select" required>
                <option value="" selected disabled>Select Model</option>

                <option value="black-forest-labs/FLUX.1-dev">FLUX.1-dev</option>

                <option value="black-forest-labs/FLUX.1-schnell">
                  FLUX.1-schnell
                </option>

                <option value="stabilityai/stable-diffusion-xl-base-1.0">
                  Stable Diffusion XL
                </option>

                <option value="runwayml/stable-diffusion-v1-5">
                  Stable Diffusion v1.5
                </option>

                <option value="prompthero/openjourney">Openjourney</option>
              </select>
            </div>

            <!-- Image Count -->
            <div class="select-wrapper">
              <select class="custom-select" id="count-select" required>
                <option value="" selected disabled>Image Count</option>

                <option value="1">1 Image</option>
                <option value="2">2 Images</option>
                <option value="3">3 Images</option>
                <option value="4">4 Images</option>
              </select>
            </div>

            <!-- Aspect Ratio -->
            <div class="select-wrapper">
              <select class="custom-select" id="ratio-select" required>
                <option value="" selected disabled>Aspect Ratio</option>

                <option value="1/1">Square (1:1)</option>

                <option value="16/9">Landscape (16:9)</option>

                <option value="9/16">Portrait (9:16)</option>
              </select>
            </div>

            <!-- Generate Button -->
            <button type="submit" class="generate-btn">
              <i class="fa-solid fa-wand-sparkles"></i>
              Generate
            </button>
          </div>

          <!-- Result Gallery -->
          <div class="gallery-grid"></div>
        </form>
      </div>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
